# hcw 기기 등록부
# 형식:  <컴퓨터 이름(소문자)> = development | workstation
#  - 컴퓨터 이름은 `hcw info` 의 "machine name" 값을 소문자로 적습니다.
#  - workstation 으로 등록된 기기에서만 논문 조건(purpose = paper) 실행이 허용됩니다.
#  - 노트북은 development 로 등록합니다 (docs/design/01_environment_check.md §4.3).

[machines]
desktop-4jjotvl = development   # 노트북 (개발 전용, 2026-10-21 등록)
